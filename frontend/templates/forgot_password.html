<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - WorkPulse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --primary-dark: #1a252f;
            --bg-light: #f8f9fa;
            --bg-dark: #121212;
            --card-light: #ffffff;
            --card-dark: #1e1e1e;
            --text-light: #2c3e50;
            --text-dark: #ecf0f1;
            --border-light: #e0e0e0;
            --border-dark: #333333;
        }

        body {
            background: linear-gradient(135deg, #2c3e50 0%, #1a252f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 0.875rem;
        }

        .reset-container {
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
        }

        .reset-card {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border: 1px solid var(--border-light);
        }

        .reset-header {
            background: var(--primary);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .reset-header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .reset-header p {
            font-size: 0.8125rem;
            opacity: 0.9;
            margin: 0;
        }

        .reset-body {
            padding: 30px;
            background: var(--card-light);
        }

        [data-bs-theme="dark"] .reset-body {
            background: var(--card-dark);
            border-color: var(--border-dark);
        }

        .form-label {
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 0.8125rem;
            color: var(--text-light);
        }

        [data-bs-theme="dark"] .form-label {
            color: var(--text-dark);
        }

        .form-control {
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 0.8125rem;
            border: 1px solid var(--border-light);
        }

        [data-bs-theme="dark"] .form-control {
            background-color: #2c2c2c;
            border-color: var(--border-dark);
            color: var(--text-dark);
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(44, 62, 80, 0.1);
        }

        .btn-primary {
            background: var(--primary);
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .alert {
            border-radius: 6px;
            font-size: 0.8125rem;
            padding: 10px 15px;
        }

        .back-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.8125rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-card">
            <div class="reset-header">
                <h1><i class="fas fa-lock me-2"></i>Reset Password</h1>
                <p>Enter your email to reset your password</p>
            </div>
            
            <div class="reset-body">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show mb-3">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                
                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" name="email" 
                               placeholder="name@example.com" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        <i class="fas fa-paper-plane me-2"></i> Send Reset Link
                    </button>
                    
                    <div class="text-center">
                        <a href="{{ url_for('login') }}" class="back-link">
                            <i class="fas fa-arrow-left me-1"></i> Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
