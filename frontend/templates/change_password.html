
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - WorkPulse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --primary-dark: #1a252f;
            --primary-light: #34495e;
            --secondary: #7f8c8d;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --info: #3498db;
            
            --bg-light: #f8f9fa;
            --bg-dark: #121212;
            --card-light: #ffffff;
            --card-dark: #1e1e1e;
            --text-light: #2c3e50;
            --text-dark: #ecf0f1;
            --text-muted-light: #7f8c8d;
            --text-muted-dark: #bdc3c7;
            --border-light: #e0e0e0;
            --border-dark: #333333;
            --input-bg-light: #ffffff;
            --input-bg-dark: #2c2c2c;
        }

        [data-bs-theme="dark"] {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }

        [data-bs-theme="light"] {
            background-color: var(--bg-light);
            color: var(--text-light);
        }

        body {
            transition: background-color 0.3s ease;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            font-size: 0.875rem;
        }

        .password-container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }

        .password-card {
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-light);
        }

        [data-bs-theme="dark"] .password-card {
            background-color: var(--card-dark);
            border-color: var(--border-dark);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
        }

        [data-bs-theme="light"] .password-card {
            background-color: var(--card-light);
            border-color: var(--border-light);
        }

        .password-header {
            background: var(--primary);
            color: white;
            padding: 25px;
            text-align: center;
            position: relative;
        }

        .security-icon {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            border: 2px solid var(--primary);
        }

        .password-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .password-subtitle {
            opacity: 0.9;
            font-weight: 400;
            font-size: 0.8125rem;
            margin-bottom: 0;
        }

        .password-body {
            padding: 30px;
        }

        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
        }

        .theme-toggle-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-size: 0.8125rem;
        }

        .theme-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .form-label {
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 0.8125rem;
            color: var(--text-light);
        }

        [data-bs-theme="dark"] .form-label {
            color: var(--text-dark);
        }

        .input-group {
            position: relative;
        }

        .input-group-text {
            background: transparent;
            border-right: none;
            color: var(--text-muted-light);
            font-size: 0.8125rem;
        }

        [data-bs-theme="dark"] .input-group-text {
            color: var(--text-muted-dark);
        }

        .form-control {
            border-radius: 6px;
            padding: 10px 12px;
            border: 1px solid var(--border-light);
            font-size: 0.8125rem;
            transition: all 0.2s ease;
        }

        [data-bs-theme="dark"] .form-control {
            background-color: var(--input-bg-dark);
            border-color: var(--border-dark);
            color: var(--text-dark);
        }

        [data-bs-theme="light"] .form-control {
            background-color: var(--input-bg-light);
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(44, 62, 80, 0.1);
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted-light);
            cursor: pointer;
            z-index: 5;
            font-size: 0.8125rem;
        }

        [data-bs-theme="dark"] .password-toggle {
            color: var(--text-muted-dark);
        }

        .password-strength-container {
            margin-top: 6px;
        }

        .password-strength-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 0.75rem;
        }

        .password-strength {
            height: 4px;
            border-radius: 2px;
            background: var(--border-light);
            overflow: hidden;
        }

        [data-bs-theme="dark"] .password-strength {
            background: var(--border-dark);
        }

        .strength-fill {
            height: 100%;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .strength-weak { 
            background: var(--danger); 
            width: 33%; 
        }
        .strength-medium { 
            background: var(--warning); 
            width: 66%; 
        }
        .strength-strong { 
            background: var(--success); 
            width: 100%; 
        }

        .password-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        @media (max-width: 576px) {
            .password-row {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }

        .password-field-container {
            position: relative;
        }

        .requirements-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin: 15px 0 20px 0;
            background: rgba(44, 62, 80, 0.03);
            border-radius: 8px;
            padding: 15px;
        }

        [data-bs-theme="dark"] .requirements-grid {
            background: rgba(255, 255, 255, 0.03);
        }

        .requirement-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            padding: 6px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.5);
        }

        [data-bs-theme="dark"] .requirement-item {
            background: rgba(255, 255, 255, 0.05);
        }

        .requirement-icon {
            width: 18px;
            height: 18px;
            min-width: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            background: var(--border-light);
            color: var(--text-muted-light);
        }

        [data-bs-theme="dark"] .requirement-icon {
            background: var(--border-dark);
            color: var(--text-muted-dark);
        }

        .requirement-met {
            color: var(--success) !important;
        }

        .requirement-met .requirement-icon {
            background: var(--success);
            color: white !important;
        }

        .btn-update {
            background: var(--primary);
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 8px;
        }

        .btn-update:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(44, 62, 80, 0.2);
        }

        .btn-update:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .form-section {
            margin-bottom: 20px;
        }

        .form-section-title {
            font-size: 0.9375rem;
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-light);
        }

        [data-bs-theme="dark"] .form-section-title {
            border-bottom-color: var(--border-dark);
            color: var(--text-dark);
        }

        .password-match-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            margin-top: 4px;
        }

        .match-icon {
            font-size: 12px;
        }

        .match-success {
            color: var(--success);
        }

        .match-error {
            color: var(--danger);
        }

        .text-muted {
            color: var(--text-muted-light) !important;
            font-size: 0.75rem;
        }

        [data-bs-theme="dark"] .text-muted {
            color: var(--text-muted-dark) !important;
        }

        .alert {
            border-radius: 6px;
            border: none;
            padding: 10px 15px;
            margin-bottom: 20px;
            font-size: 0.8125rem;
        }

        .back-to-login {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border-light);
        }

        [data-bs-theme="dark"] .back-to-login {
            border-top-color: var(--border-dark);
        }

        .password-hint {
            font-size: 0.75rem;
            color: var(--text-muted-light);
            margin-top: 4px;
            display: block;
        }

        [data-bs-theme="dark"] .password-hint {
            color: var(--text-muted-dark);
        }

        .btn-loading {
            position: relative;
            color: transparent !important;
        }

        .btn-loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            margin: -8px 0 0 -8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .form-progress {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
        }

        .progress-step {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--border-light);
            color: var(--text-muted-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 500;
            position: relative;
            z-index: 2;
        }

        [data-bs-theme="dark"] .progress-step {
            background: var(--border-dark);
            color: var(--text-muted-dark);
        }

        .progress-step.active {
            background: var(--primary);
            color: white;
        }

        .progress-line {
            position: absolute;
            top: 50%;
            left: 30px;
            right: 30px;
            height: 1px;
            background: var(--border-light);
            transform: translateY(-50%);
            z-index: 1;
        }

        [data-bs-theme="dark"] .progress-line {
            background: var(--border-dark);
        }

        @media (max-height: 700px) {
            .password-container {
                padding: 10px;
            }
            
            .password-body {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Theme Toggle -->
    <div class="theme-toggle">
        <button id="themeToggle" class="btn theme-toggle-btn">
            <i class="fas fa-moon" id="themeIcon"></i>
        </button>
    </div>

    <div class="container">
        <div class="password-container">
            <div class="password-card">
                <!-- Header -->
                <div class="password-header">
                    <div class="security-icon">
                        <i class="fas fa-lock"></i>
                    </div>
                    <h1 class="password-title">Set New Password</h1>
                    <p class="password-subtitle">Secure your account with a strong password</p>
                </div>
                
                <!-- Progress Indicator -->
                <div class="form-progress">
                    <div class="progress-step active">
                        <i class="fas fa-key"></i>
                    </div>
                    <div class="progress-line"></div>
                    <div class="progress-step">
                        <i class="fas fa-check"></i>
                    </div>
                </div>

                <!-- Form Body -->
                <div class="password-body">
                    {% if error %}
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            <div>{{ error }}</div>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    {% endif %}

                    {% if success %}
                    <div class="alert alert-success alert-dismissible fade show" role="alert">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-check-circle me-2"></i>
                            <div>{{ success }}</div>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    {% endif %}
                    
                    <form method="POST" action="{{ url_for('change_password') }}" id="passwordForm">
                        <!-- Current Password Section -->
                        <div class="form-section">
                            <h3 class="form-section-title">
                                <i class="fas fa-unlock"></i>
                                Current Password
                            </h3>
                            <div class="mb-3">
                                <label class="form-label">
                                    <i class="fas fa-key"></i>
                                    Temporary Password
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-lock"></i>
                                    </span>
                                    <input type="password" class="form-control" 
                                           name="current_password" 
                                           placeholder="Enter temporary password"
                                           required>
                                    <button type="button" class="password-toggle" onclick="togglePassword(this)">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                                <small class="password-hint">
                                    <i class="fas fa-info-circle me-1"></i>
                                    Enter the temporary password from your manager
                                </small>
                            </div>
                        </div>

                        <!-- New Password Section -->
                        <div class="form-section">
                            <h3 class="form-section-title">
                                <i class="fas fa-shield-alt"></i>
                                Create New Password
                            </h3>
                            
                            <!-- Side-by-side password fields -->
                            <div class="password-row">
                                <div class="password-field-container">
                                    <label class="form-label">
                                        <i class="fas fa-key"></i>
                                        New Password
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-lock"></i>
                                        </span>
                                        <input type="password" class="form-control" 
                                               name="new_password" 
                                               id="newPassword"
                                               placeholder="Create new password"
                                               required
                                               oninput="updatePasswordStrength()">
                                        <button type="button" class="password-toggle" onclick="togglePassword(this)">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                    </div>
                                    
                                    <!-- Password Strength Indicator -->
                                    <div class="password-strength-container">
                                        <div class="password-strength-label">
                                            <span>Strength:</span>
                                            <span id="strengthText">None</span>
                                        </div>
                                        <div class="password-strength">
                                            <div class="strength-fill" id="strengthBar"></div>
                                        </div>
                                    </div>
                                </div>

                                <div class="password-field-container">
                                    <label class="form-label">
                                        <i class="fas fa-redo"></i>
                                        Confirm Password
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-lock"></i>
                                        </span>
                                        <input type="password" class="form-control" 
                                               name="confirm_password" 
                                               id="confirmPassword"
                                               placeholder="Confirm password"
                                               required
                                               oninput="checkPasswordMatch()">
                                        <button type="button" class="password-toggle" onclick="togglePassword(this)">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                    </div>
                                    
                                    <!-- Password Match Indicator -->
                                    <div id="matchIndicator" class="password-match-indicator"></div>
                                </div>
                            </div>

                            <!-- Compact Password Requirements Grid -->
                            <div class="requirements-grid" id="requirementsGrid"></div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-update" id="submitBtn" disabled>
                            <i class="fas fa-check-circle me-1"></i>
                            Update Password & Continue
                        </button>
                    </form>

                    <!-- Back to Login -->
                    <div class="back-to-login">
                        <small class="text-muted">
                            Remember your password? 
                            <a href="{{ url_for('login') }}" class="text-decoration-none">
                                <i class="fas fa-sign-in-alt me-1"></i>
                                Back to Login
                            </a>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
        updateThemeIcon(savedTheme);

        themeToggle.addEventListener('click', function() {
            const currentTheme = document.documentElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-bs-theme', newTheme);
            updateThemeIcon(newTheme);
            localStorage.setItem('theme', newTheme);
        });

        function updateThemeIcon(theme) {
            themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        // Password visibility toggle
        function togglePassword(button) {
            const input = button.closest('.input-group').querySelector('input');
            const icon = button.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // Password requirements
        const requirements = [
            { id: 'length', text: '8+ characters', regex: /.{8,}/ },
            { id: 'uppercase', text: 'Uppercase letter', regex: /[A-Z]/ },
            { id: 'lowercase', text: 'Lowercase letter', regex: /[a-z]/ },
            { id: 'number', text: 'Number', regex: /[0-9]/ },
            { id: 'special', text: 'Special character', regex: /[!@#$%^&*]/ }
        ];

        // Initialize requirements grid
        function initializeRequirements() {
            const container = document.getElementById('requirementsGrid');
            container.innerHTML = '';
            
            requirements.forEach(req => {
                const item = document.createElement('div');
                item.className = 'requirement-item';
                item.id = `req-${req.id}`;
                item.innerHTML = `
                    <span class="requirement-icon">
                        <i class="fas fa-times"></i>
                    </span>
                    <span>${req.text}</span>
                `;
                container.appendChild(item);
            });
        }

        // Check password strength
        function checkPasswordStrength(password) {
            let strength = 0;
            
            requirements.forEach(req => {
                if (req.regex.test(password)) strength++;
            });
            
            return strength;
        }

        // Update password strength indicator
        function updatePasswordStrength() {
            const password = document.getElementById('newPassword').value;
            const strength = checkPasswordStrength(password);
            
            requirements.forEach((req, index) => {
                const item = document.getElementById(`req-${req.id}`);
                const icon = item.querySelector('.requirement-icon i');
                const isMet = req.regex.test(password);
                
                if (isMet) {
                    item.classList.add('requirement-met');
                    icon.className = 'fas fa-check';
                } else {
                    item.classList.remove('requirement-met');
                    icon.className = 'fas fa-times';
                }
            });
            
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');
            
            bar.classList.remove('strength-weak', 'strength-medium', 'strength-strong');
            
            if (password.length === 0) {
                bar.style.width = '0%';
                text.textContent = 'None';
                text.style.color = '';
            } else if (strength < 3) {
                bar.classList.add('strength-weak');
                text.textContent = 'Weak';
                text.style.color = '#e74c3c';
            } else if (strength < 5) {
                bar.classList.add('strength-medium');
                text.textContent = 'Medium';
                text.style.color = '#f39c12';
            } else {
                bar.classList.add('strength-strong');
                text.textContent = 'Strong';
                text.style.color = '#27ae60';
            }
            
            updateSubmitButton();
        }

        // Check password match
        function checkPasswordMatch() {
            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const indicator = document.getElementById('matchIndicator');
            
            if (confirm.length === 0) {
                indicator.innerHTML = '';
                return false;
            }
            
            if (password === confirm) {
                indicator.innerHTML = `
                    <i class="fas fa-check-circle match-icon match-success"></i>
                    <span class="match-success">Passwords match</span>
                `;
                return true;
            } else {
                indicator.innerHTML = `
                    <i class="fas fa-times-circle match-icon match-error"></i>
                    <span class="match-error">Passwords don't match</span>
                `;
                return false;
            }
        }

        // Update submit button state
        function updateSubmitButton() {
            const password = document.getElementById('newPassword').value;
            const strength = checkPasswordStrength(password);
            const isMatching = checkPasswordMatch();
            const isStrong = strength >= 5;
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = !(isStrong && isMatching);
        }

        // Form submission
        document.getElementById('passwordForm').addEventListener('submit', function(e) {
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            
            submitBtn.disabled = true;
            submitBtn.classList.add('btn-loading');
            submitBtn.innerHTML = '';
        });

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            initializeRequirements();
            document.querySelector('input[name="current_password"]').focus();
            
            document.getElementById('newPassword').addEventListener('input', updatePasswordStrength);
            document.getElementById('confirmPassword').addEventListener('input', function() {
                checkPasswordMatch();
                updateSubmitButton();
            });
            
            document.getElementById('newPassword').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    document.getElementById('confirmPassword').focus();
                }
            });
            
            document.getElementById('confirmPassword').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (!document.getElementById('submitBtn').disabled) {
                        document.getElementById('submitBtn').click();
                    }
                }
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                const submitBtn = document.getElementById('submitBtn');
                if (!submitBtn.disabled) {
                    submitBtn.click();
                }
            }
        });
    </script>
</body>
</html>
